<input type="file" accept=".als" (change)="uploadFile($event)"/>
<input type="text" [(ngModel)]="songName" placeholder="Titre du morceau"/>

<ng-container *ngIf="recordingInitData">
  src/assets/recordings/{{recordingInitData.name}}.json
  <textarea [ngModel]="recordingInitData | json" rows="10"></textarea>
</ng-container>

<ng-container *ngIf="songEntry">
  src/app/song/entries/{{songName}}.ts
  <textarea [ngModel]="songEntry" rows="10"></textarea>
</ng-container>
