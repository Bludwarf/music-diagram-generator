<!-- Upload -->
<input #fileInput type="file" accept=".wav,.mp3" (change)="uploadFile($event)"/>

<!-- Transport -->
<div id="transport">
    @if (recording()) {
        <div class="buttons">
            <app-transport-button icon="tools" (click)="promptSetting()"></app-transport-button>
        </div>
        <div class="buttons" id="transport-buttons">
            <app-transport-button icon="play" *ngIf="!playing" (click)="playSong()"
                                  [disabled]="playButtonIsDisabled"></app-transport-button>
            <app-transport-button icon="pause" *ngIf="playing" (click)="pauseSong()"></app-transport-button>
        </div>
    }

    <div id="song-map">
        <app-structure-map [structure]="structure()" [timecode]="timecode"
                           [currentPatternInStructure]="currentPatternInStructure()"
                           (clickPatternInStructure)="onClickElementInStructure($event)"></app-structure-map>
        @if (recording()) {
            <app-sample-map [transportSeconds]="roundedTransportSeconds()"></app-sample-map>
        }
    </div>

</div>

<app-part-tabs [structure]="structure()"
               [currentPartInStructure]="currentPartInStructure()"
               [loopedElement]="loopedElement"
               (clickPartInStructure)="onClickElementInStructure($event)"
></app-part-tabs>

@if (currentPartInStructure(); as currentPartInStructure) {
    <app-part-line [partInStructure]="currentPartInStructure"
                   [currentSectionInStructure]="currentSectionInStructure()"
                   [currentPatternInStructure]="currentPatternInStructure()"
                   [loopedElement]="loopedElement"
                   (clickPatternInStructure)="onClickElementInStructure($event)"
                   (clickSectionInStructure)="onClickElementInStructure($event)"
    ></app-part-line>
}


<!-- TODO on reprend le composant A en attendant de trouver la bonne manière de faire -->
<!-- Détail sur le pattern courant -->
@if (currentPatternInStructure(); as currentPatternInStructure) {

    <div class="chords-and-fretboard">

        <div class="chords-and-staff">

            <div class="pattern-name-container" [style.backgroundColor]="getPatternColor(currentPatternInStructure)">
        <span class="active pattern" [class.looped]="currentPatternInStructure === loopedElement">
          {{ currentPatternInStructure.pattern.name }}
        </span>
            </div>

            <app-chords-grid [chords]="getPatternChords(currentPatternInStructure)" [key]="currentKey()"
                             [currentBar]="currentBar() - currentPatternInStructure.startPosition.bars"
                             [currentBarIsLooped]="currentBar() !== undefined && (loopedElement?.startPosition?.bars === currentBar() && loopedElement?.endPosition?.bars === currentBar() + 1)"
                             [style.border-color]="getPatternColor(currentPatternInStructure)"
                             (clickBar)="onClickBar(currentPatternInStructure.startPosition.bars + $event)"></app-chords-grid>

            <!-- <span class="pattern-timecode">{{ currentPatternInStructureRelativeTimecode }} / {{ currentPatternInStructure.pattern.duration.toBars() }}</span> -->

            <!--        <ng-container-->

            <!--          <app-rythm-bar-->
            <!--            [number]="barNumber"-->
            <!--            [events]="currentPatternInStructure.pattern.events ?? []"-->
            <!--            (addEvent)="addEvent($event)"-->
            <!--            (removeEvent)="removeEvent($event)"-->
            <!--            [timecode]="rythmBarTimecode"-->
            <!--          ></app-rythm-bar>-->
            <!--        </ng-container>-->
            <!--      </ng-container>-->

            <div class="keyboard" *ngIf="keyboardHeight"
                 [ngStyle]="{height: keyboardHeight, maxHeight: keyboardHeight}">
                <app-keyboard [lowerOctavedNote]="lowerOctavedNote" [higherOctavedNote]="higherOctavedNote"
                              [activeKeys]="keyboardState?.activeKeys || []" [keyHeightInPx]="keyHeightInPx"
                              [markedOctavedNotes]="markedOctavedNotes"></app-keyboard>
            </div>

            @if (position(); as position) {
                <app-sheet-music *ngIf="musicXml && position" [musicXmlContent]="musicXml" [position]="position"
                                 (swipeLeft)="onSheetMusicSwipe(1)"
                                 (swipeRight)="onSheetMusicSwipe(-1)"></app-sheet-music>
            }

        </div>

    </div>
