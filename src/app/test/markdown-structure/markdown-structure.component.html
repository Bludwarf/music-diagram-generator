@if (markdownA) {

    <h2>Markdown A</h2>

    @if (markdownA.sections) {
        <h3>Sections</h3>
        <textarea [ngModel]="markdownA.sections" rows="19"></textarea>
        <textarea [ngModel]="markdownA.sectionsPadded" rows="19" cols="30"></textarea>
        <textarea [ngModel]="markdownA.sectionsPaddedParagraph" rows="19" cols="30"></textarea>
    }

}
